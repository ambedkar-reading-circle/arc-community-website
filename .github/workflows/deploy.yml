name: Build & Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build Hugo site + Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Hugo binary
        uses: actions/cache@v4
        with:
          path: /home/runner/actions_hugo
          key: hugo-0.164.0-extended-linux

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build Hugo site
        run: hugo --minify
        # assets/css/tw.css is committed precompiled — Tailwind runs only
        # dev-side (npm run css:build) when styling or layout classes change.

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
