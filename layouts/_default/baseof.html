<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if eq .Title .Site.Title }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ with .Site.Title }} — {{ . }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
      background: #fafafa;
      color: #1a1a1a;
    }
    main.uc { max-width: 40rem; text-align: center; }
    main.uc h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
    }
    main.uc .msg { font-size: 1.05rem; opacity: 0.85; }
    main.uc .msg strong { display: block; margin-bottom: 0.5rem; font-size: 1.1rem; opacity: 1; }
    @media (prefers-color-scheme: dark) {
      body { background: #11141a; color: #e8e8e8; }
    }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
