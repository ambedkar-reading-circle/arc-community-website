{{ define "main" }}
<div class="hero">
  <h1>Ambedkar Reading Circle</h1>
  <p>{{ site.Params.description }}</p>
</div>

<section class="chapters container">
  {{ range where site.RegularPages "Section" "chapters" }}
  <div class="chapter-card">
    <h2>{{ .Title }}</h2>
    {{ .Content }}
  </div>
  {{ end }}
</section>
{{ end }}
